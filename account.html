<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account | Builder Rank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="brand-header">
        <a class="brand-lockup" href="/" aria-label="Builder Rank home">
          <img data-builder-logo alt="Builder Rank logo" />
          <span>Builder Rank</span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="/why-geo">Why GEO</a>
          <a href="/pricing">Pricing</a>
          <a href="/run-report">Run Report</a>
          <a href="/account" aria-current="page">Account</a>
          <button class="nav-pay-button" type="button" data-payment-link>Buy Report</button>
        </nav>
      </header>

      <section class="account-shell">
        <div class="login-panel">
          <p class="eyebrow">Customer Account</p>
          <h1>Sign in to view purchased reports.</h1>
          <p>
            Enter the email used at checkout to see reports saved in this browser. Full password login
            and cloud report storage come next.
          </p>
          <div class="login-form" aria-label="Preview login form">
            <label>
              <span>Email</span>
              <input id="accountEmailInput" type="email" placeholder="you@company.com" />
            </label>
            <button id="accountEmailButton" type="button">Continue</button>
          </div>
        </div>

        <aside class="report-history" aria-label="Purchased reports">
          <div class="history-topline">
            <div>
              <p class="eyebrow">Your reports</p>
              <h2>Purchased report history</h2>
            </div>
            <span id="reportCountBadge">0 saved</span>
          </div>
          <div id="accountStatus" class="account-status" role="status"></div>
          <div id="reportHistoryList" class="history-list"></div>
        </aside>
      </section>
    </main>

    <script src="assets/client.js"></script>
  </body>
</html>
